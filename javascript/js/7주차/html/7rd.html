<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사칙연산 계산기</title>
    <link rel="stylesheet" href="7rd.css">
</head>
<body>
    <div class="calculator-container">
        <h2>계산기</h2>
        <div class="button-group">
            <button onclick="calculate('+')">덧셈 (+)</button>
            <button onclick="calculate('-')">뺄셈 (-)</button>
            <button onclick="calculate('*')">곱셈 (*)</button>
            <button onclick="calculate('/')">나눗셈 (÷)</button>
        </div>
    </div>

    <script src="7rd.js"></script>
</body>
</html>
